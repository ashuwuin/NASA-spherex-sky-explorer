services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: "8000"
      SPHEREX_PREWARM: "true"
    volumes:
      - spherex-cache:/home/user/.cache/spherex
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  spherex-cache:
